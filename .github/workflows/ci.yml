name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dxapp.json
        run: python3 -c "import json; json.load(open('dxapp.json')); print('dxapp.json OK')"
      - name: Shell syntax check
        run: bash -n src/*.sh
      - name: Unit tests (bundled helpers)
        run: pip install pytest && pytest tests/ -q
